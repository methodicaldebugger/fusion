[package]
name = "foundry"
version = "0.1.0"
edition = "2021"
description = "Fusion package, project, build, and toolchain manager"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "foundry"
path = "src/main.rs"
