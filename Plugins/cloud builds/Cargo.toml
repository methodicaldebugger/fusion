[package]
name = "fusion-plugin-cloud-builds"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive", "env"] }
axum = "0.7"
tempfile = "3.8"
libloading = "0.8"