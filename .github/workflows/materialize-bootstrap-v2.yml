name: Repair bootstrap implementation

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose source repair
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import traceback
          out=[]
          try:
              for fn, needles in {
                'src/parser.rs':['Token::Fn => Ok(Some(self.parse_function()?)),','fn parse_function(&mut self) -> Result<Statement, ParseError> {','Expression::MethodCall {'],
                'src/type_checker.rs':['Expression::MethodCall {','Statement::For {','Expression::Call {'],
                'src/interpreter.rs':['Statement::For {','// Match','// Function calls'],
              }.items():
                s=Path(fn).read_text()
                out.append(fn + ' len=' + str(len(s)))
                for n in needles: out.append('  ' + repr(n) + ' count=' + str(s.count(n)))
          except Exception:
              out.append(traceback.format_exc())
          Path('repair-diagnostic.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          cat repair-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repair-diagnostic.txt
          git commit -m "Record repair diagnostics"
          git push origin HEAD:fusion-bootstrap-ready-v2
