name: Materialize bootstrap-ready-v2

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap.patch.gz.b64 | gzip -d > bootstrap.patch
          sed -n '1,120p' bootstrap.patch > patch-head.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-head.txt
          git commit -m "Inspect staged bootstrap patch"
          git push origin HEAD:fusion-bootstrap-ready-v2
