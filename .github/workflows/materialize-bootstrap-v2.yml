name: Materialize bootstrap-ready-v2

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose staged patch
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import base64, gzip, pathlib, traceback
          out=[]
          p=pathlib.Path('bootstrap.patch.gz.b64')
          out.append(f'exists={p.exists()} size={p.stat().st_size if p.exists() else -1}')
          try:
              src=p.read_bytes()
              out.append(f'first16={src[:16]!r}')
              raw=base64.b64decode(b''.join(src.split()), validate=True)
              out.append(f'decoded={len(raw)} first16={raw[:16]!r}')
              patch=gzip.decompress(raw)
              out.append(f'patch={len(patch)} first200={patch[:200]!r}')
          except Exception as e:
              out.append(type(e).__name__ + ': ' + str(e))
              out.append(traceback.format_exc())
          pathlib.Path('patch-diagnostic.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          cat patch-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-diagnostic.txt
          git commit -m "Record bootstrap patch diagnostics"
          git push origin HEAD:fusion-bootstrap-ready-v2
