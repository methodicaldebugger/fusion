name: Materialize bootstrap-ready-v2

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged implementation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap.patch.gz.b64 | gzip -d > bootstrap.patch
          if git apply --check bootstrap.patch; then
            git apply bootstrap.patch
            rm bootstrap.patch bootstrap.patch.gz.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.rs src/parser.rs src/type_checker.rs src/interpreter.rs src/ast.rs src/types.rs
            git commit -m "Materialize bootstrap language implementation"
            git push origin HEAD:fusion-bootstrap-ready-v2
          else
            echo "Staged bootstrap patch no longer applies cleanly; no source changes made."
          fi
