name: Materialize bootstrap-ready-v2

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect staged patch bytes
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import base64, pathlib
          s=pathlib.Path('bootstrap.patch.gz.b64').read_bytes()
          compact=b''.join(s.split())
          bad=[]
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          for i,b in enumerate(compact):
              if b not in alphabet:
                  bad.append((i,b,compact[max(0,i-30):i+30]))
                  if len(bad)>=20: break
          out=[f'raw={len(s)} compact={len(compact)}', f'bad_count_sample={len(bad)}']
          out += [f'bad={i} byte={b} context={ctx!r}' for i,b,ctx in bad]
          try:
              raw=base64.b64decode(compact, validate=False)
              out.append(f'non-strict decoded={len(raw)} first16={raw[:16]!r}')
          except Exception as e: out.append('non-strict error='+repr(e))
          pathlib.Path('patch-diagnostic.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          cat patch-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-diagnostic.txt
          git commit -m "Inspect invalid bootstrap patch bytes"
          git push origin HEAD:fusion-bootstrap-ready-v2
