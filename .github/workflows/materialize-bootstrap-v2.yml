name: Materialize bootstrap-ready-v2

on:
  push:
    branches: [fusion-bootstrap-ready-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize staged implementation patch
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap.patch.gz.b64
          git checkout HEAD^ -- src/main.rs src/parser.rs src/type_checker.rs src/interpreter.rs src/ast.rs src/types.rs
          base64 -d bootstrap.patch.gz.b64 | gzip -d > bootstrap.patch
          git apply --check bootstrap.patch
          git apply bootstrap.patch
          rm bootstrap.patch bootstrap.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo fmt --all
          cargo check --all-targets
          cargo test --all-targets
          git add src/main.rs src/parser.rs src/type_checker.rs src/interpreter.rs src/ast.rs src/types.rs
          git commit -m "Materialize bootstrap language implementation"
          git push origin HEAD:fusion-bootstrap-ready-v2
